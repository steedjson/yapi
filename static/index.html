<!DOCTYPE html>
<html>
<head>
<meta  id="cross-request-sign"  charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="keywords" content="yapi接口管理,api管理,接口管理,api,接口,接口文档,api文档,接口管理系统" />
<meta name="description" content="YApi 是高效、易用、功能强大的 api 管理平台，旨在为开发、产品、测试人员提供更优雅的接口管理服务。可以帮助开发者轻松创建、发布、维护 API，YApi 还为用户提供了优秀的交互体验，开发人员只需利用平台提供的接口数据写入工具以及简单的点击操作就可以实现接口的管理。" />
<title>YApi-高效、易用、功能强大的可视化接口管理平台</title>
<link rel="icon" type="image/png" sizes="192x192" href="/image/favicon.png">
<script>
    // 防闪烁:在样式加载前同步恢复本地皮肤偏好(与 client/theme.js 的存储键/白名单保持一致)
    (function() {
        try {
            var skin = localStorage.getItem('yapi-skin');
            if (skin && ['enterprise', 'gov', 'anime', 'dark'].indexOf(skin) > -1 && skin !== 'enterprise') {
                document.documentElement.setAttribute('data-skin', skin);
            }
        } catch (e) {}
    })();
</script>
<script>
    document.write('<script src="/prd/assets.js?v=' + Math.random() + '"><\/script>');
</script>

<script>
    // 初始 chunk 注入数据驱动（分包策略归构建工具后不再静态可知）：
    // build/rsbuild-assets.js 依 entrypoint 执行顺序写入 WEBPACK_INITIAL_CHUNKS
    // （runtime 置首、入口置尾），CSS 按同一顺序在 head 注入。
    (window.WEBPACK_INITIAL_CHUNKS || []).forEach(function(key) {
        var asset = window.WEBPACK_ASSETS[key];
        if (asset && asset.css) {
            document.write('<link rel="stylesheet"  href="/prd/' + asset.css + '" />');
        }
    });
</script>

</head>
<body>
<div id="yapi" style="height: 100%;"></div>


<script>
    (window.WEBPACK_INITIAL_CHUNKS || []).forEach(function(key) {
        var asset = window.WEBPACK_ASSETS[key];
        if (asset && asset.js) {
            document.write('<script src="/prd/' + asset.js + '"><\/script>');
        }
    });
</script>
</body>
</html>
