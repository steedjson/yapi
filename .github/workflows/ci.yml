name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    # 显式钉版 Ubuntu 24.04：ubuntu-latest 将于 2026-10-19 迁移 Ubuntu 26，
    # 届时应先验证构建与 mongo service 行为后再升级（TECH_DEBT「CI 平台告警」项）。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        # SHA 固定（供应链加固，TECH_DEBT CI 项）：对应 actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node (version from .nvmrc, npm cache)
        # SHA 固定：对应 actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write CI-only config.json (gitignored, required by server/yapi.js)
        run: |
          cat > config.json <<'EOF'
          {
            "port": "3000",
            "adminAccount": "admin@admin.com",
            "timeout": 120000,
            "db": {
              "servername": "127.0.0.1",
              "DATABASE": "yapi_test",
              "port": 27017,
              "user": "",
              "pass": "",
              "authSource": ""
            },
            "mail": {
              "enable": false,
              "host": "127.0.0.1",
              "port": 465,
              "from": "ci@example.com",
              "auth": {
                "user": "ci@example.com",
                "pass": "ci-placeholder"
              }
            }
          }
          EOF

      - name: Generate client plugin module (gitignored, required by tests rendering import/export hooks)
        run: node -e "require('./build/clientPluginModule.js').initPlugins(process.cwd())"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build-client

      - name: Audit baseline diff gate
        run: npm run audit:ci
